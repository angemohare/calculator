<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Domino's Dynamic Poster</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="poster">

  <div class="bg-circle c1"></div>
  <div class="bg-circle c2"></div>

  <nav>
    <div class="logo">DOMINO'S</div>
    <button class="order-btn">ORDER NOW</button>
  </nav>

  <div class="content">

    <div class="left">

      <h1>
        HOT &<br>
        CHEESY<br>
        PIZZA
      </h1>

      <p class="offer">
        FLAT 50% OFF
      </p>

      <p class="desc">
        Delicious pizza loaded with cheese,
        fresh veggies & crispy crust.
      </p>

      <button id="menuBtn">
        VIEW MENU
      </button>

    </div>

    <div class="right">

      <div class="pizza-box">
        <img
          src="https://images.unsplash.com/photo-1513104890138-7c749659a591?q=80&w=1200&auto=format&fit=crop"
          alt="Pizza"
          class="pizza"
        >
      </div>

    </div>

  </div>

</div>

<script src="script.js"></script>
</body>
</html>
